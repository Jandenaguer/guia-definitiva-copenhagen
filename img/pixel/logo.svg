<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" role="img" aria-label="Guía definitiva de Copenhague">
  <title>Guía definitiva de Copenhague</title>
  <defs>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fffbcc"/>
      <stop offset="45%"  stop-color="#ffe600"/>
      <stop offset="55%"  stop-color="#ffa800"/>
      <stop offset="100%" stop-color="#ff5e00"/>
    </linearGradient>
    <linearGradient id="hielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="50%"  stop-color="#7ff0ff"/>
      <stop offset="100%" stop-color="#0090d8"/>
    </linearGradient>
    <!-- Trama de puntos: el "medio tono" de los banners de la época -->
    <pattern id="trama" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#0a246a"/>
      <rect width="2" height="2" fill="#3a6ea5"/>
      <rect x="2" y="2" width="2" height="2" fill="#3a6ea5"/>
    </pattern>
  </defs>

  <!-- Marco biselado -->
  <rect x="0" y="0" width="620" height="150" fill="url(#trama)"/>
  <rect x="0" y="0" width="620" height="150" fill="none" stroke="#ffffff" stroke-width="4"/>
  <rect x="4" y="4" width="612" height="142" fill="none" stroke="#12121c" stroke-width="3"/>

  <!-- Bandera danesa en pixel, esquina superior izquierda -->
  <g shape-rendering="crispEdges">
    <rect x="14" y="14" width="52" height="34" fill="#c60c30"/>
    <rect x="30" y="14" width="8"  height="34" fill="#ffffff"/>
    <rect x="14" y="26" width="52" height="8"  fill="#ffffff"/>
    <rect x="14" y="14" width="52" height="34" fill="none" stroke="#12121c" stroke-width="2"/>
  </g>

  <!-- Bandera española en pixel, esquina superior derecha (para los que vienen) -->
  <g shape-rendering="crispEdges">
    <rect x="554" y="14" width="52" height="34" fill="#c60b1e"/>
    <rect x="554" y="22" width="52" height="18" fill="#ffc400"/>
    <rect x="554" y="14" width="52" height="34" fill="none" stroke="#12121c" stroke-width="2"/>
  </g>

  <!-- Título, estilo WordArt: copia negra desplazada + relleno degradado -->
  <g font-family="Impact, Haettenschweiler, 'Arial Black', 'Arial Bold', sans-serif" text-anchor="middle">
    <text x="313" y="73" font-size="40" fill="#12121c" letter-spacing="2">GUÍA DEFINITIVA DE</text>
    <text x="310" y="70" font-size="40" fill="url(#hielo)" stroke="#12121c" stroke-width="2"
          paint-order="stroke" letter-spacing="2">GUÍA DEFINITIVA DE</text>

    <text x="315" y="122" font-size="54" fill="#12121c" letter-spacing="1">COPENHAGUE</text>
    <text x="311" y="118" font-size="54" fill="url(#oro)" stroke="#12121c" stroke-width="2.5"
          paint-order="stroke" letter-spacing="1">COPENHAGUE</text>
  </g>

  <!-- Estrellitas de brillo, muy 2001 -->
  <g fill="#ffffff" shape-rendering="crispEdges">
    <rect x="96"  y="88"  width="3" height="11"/><rect x="92"  y="92"  width="11" height="3"/>
    <rect x="528" y="60"  width="3" height="11"/><rect x="524" y="64"  width="11" height="3"/>
    <rect x="86"  y="120" width="2" height="8"/> <rect x="83"  y="123" width="8"  height="2"/>
  </g>
</svg>
